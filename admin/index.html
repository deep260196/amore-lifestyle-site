<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Manager | Meraki Touch</title>
<!-- Handles logging you in via Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<!-- This one script builds the whole admin page using admin/config.yml sitting next to this file -->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
// If someone arrives here via an "Accept the invite" or "reset password"
// email link, this sends them into the login popup automatically instead
// of leaving them on a page that looks like nothing happened.
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", user => {
    if (!user) {
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/amore-lifestyle-site/admin/";
      });
    }
  });
}
</script>
</body>
</html>
